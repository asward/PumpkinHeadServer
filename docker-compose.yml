services:
  pumpkin:
    build: .
    image: pumpkinhead:latest
    restart: unless-stopped
    ports:
      - "8443:8443"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data             # voice lines, sequences, settings, TLS cert
    devices:
      # Every device listed here must exist when the container starts.
      # Prefer the stable /dev/serial/by-id/... path for the motor board.
      # stepper4 board. Set PUMPKIN_SERIAL_DEVICE=/dev/null in .env when there is no board
      # (e.g. PUMPKIN_SERIAL_PORT=mock), or to a /dev/serial/by-id/... path.
      - ${PUMPKIN_SERIAL_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0
      - /dev/video0:/dev/video0     # USB camera
      - /dev/snd:/dev/snd           # speaker + camera microphone
      - /dev/gpiochip0:/dev/gpiochip0  # eyes + mouth (Pi 5 on older kernels: gpiochip4)
